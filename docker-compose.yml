services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-net

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-client
    ports:
      - "3001:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - ecommerce-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecommerce-server
    expose:
      - "8888"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - ecommerce-net

volumes:
  mongo-data:
  redis-data:

networks:
  ecommerce-net:
